version: 2
project_name: mur

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.buildTime={{ .Date }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - name: mur
    repository:
      owner: bifshteks
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/bifshteks/mur
    description: Which repos a workspace has, what each is for, and where each is cloned
    binaries:
      - mur
    dependencies:
      - formula: git
    hooks:
      post:
        # The binary is not notarized; without this macOS Gatekeeper refuses
        # to run it after a cask install.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mur"]
          end
