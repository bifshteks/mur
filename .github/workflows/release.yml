name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Points the plugin at this tag (ADR 0005). A job of its own, so a failed push
  # can be re-run without re-running goreleaser. Runs on master as it is after
  # goreleaser's cask commit, which the tag's checkout does not have. The tag
  # filter above also matches prereleases (v1.2.3-rc.1); they leave the pin alone.
  pin-plugin:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    concurrency:
      group: pin-plugin
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/pinplugin "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Commit to master
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Pin plugin mur $GITHUB_REF_NAME"
          git push origin master
